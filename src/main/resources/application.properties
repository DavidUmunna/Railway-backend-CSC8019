jwt.secret=this-is-the-secret-key-1234567890

# Embedded H2 datasource for local development
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jdbc:mysql://mysql.railway.internal:3306/coffee_shop
# Frontend origins allowed by backend CORS policy
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Admin user injection script (users/initscripts)
app.initscripts.admin.enabled=false
app.initscripts.admin.username=admin
app.initscripts.admin.password=Admin123!
app.initscripts.admin.first-name=System
app.initscripts.admin.last-name=Admin
app.initscripts.admin.role=ADMIN

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console